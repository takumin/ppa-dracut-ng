name: Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        dist: [bookworm, trixie, noble, resolute]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            build_type: full
          - arch: arm64
            runner: ubuntu-24.04-arm
            build_type: any
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup aqua
        uses: aquaproj/aqua-installer@3c2c18c4f50a5c53314f0caa98944926fea76022 # v4.1.0
        with:
          aqua_version: v2.64.0
          aqua_opts: -t build
      - name: Build package
        run: just build_type=${{ matrix.build_type }} package ${{ matrix.dist }}
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.dist }}-${{ matrix.arch }}
          path: |
            build/${{ matrix.dist }}/*.deb
            build/${{ matrix.dist }}/*.dsc
            build/${{ matrix.dist }}/*.tar.*
          if-no-files-found: error

  deploy:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup aqua
        uses: aquaproj/aqua-installer@3c2c18c4f50a5c53314f0caa98944926fea76022 # v4.1.0
        with:
          aqua_version: v2.64.0
          aqua_opts: -t repository
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: artifacts
      - name: Collect packages
        run: |
          for dir in artifacts/build-*; do
            name="$(basename "${dir}")"
            dist="${name#build-}"
            dist="${dist%-*}"
            mkdir -p "build/${dist}"
            cp -a "${dir}"/* "build/${dist}/"
          done
      - name: Setup secrets
        run: mkdir -m 0700 secret
      - name: Import GPG passphrase
        run: echo -n "${{ secrets.GPG_PASSPHRASE }}" | base64 -d > secret/passphrase
      - name: Import GPG signing key
        run: echo -n "${{ secrets.GPG_SIGNING_KEY }}" > secret/secret.gpg.asc
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Build repository
        run: just assets
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
